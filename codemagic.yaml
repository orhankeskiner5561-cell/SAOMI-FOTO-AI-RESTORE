workflows:
  melehat-android:
    name: MELEHAT TELSIZ Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Prepare MELEHAT source
        script: |
          set -e
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build
          cd melehat_build
          python3 ../v12_patch.py
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY
          cd melehat_build
          python3 ../v14_patch.py
          python3 ../v14_fix_patch.py
          python3 ../v15_patch.py
          python3 ../v16_patch.py
          python3 ../v26_clean_auth_patch.py
          python3 ../v27_updater_patch.py
          python3 ../c42_class_only_patch.py
          python3 ../c45_unique_package_patch.py
          python3 ../c50_version_display_patch.py
          python3 ../c52_real_radio_state_patch.py
          python3 ../c53_members_presence_patch.py
          python3 ../c54_visible_members_patch.py
          python3 ../c55_clean_direct_patch.py
          python3 ../c56_final_ui_patch.py
          python3 ../c57_reconnect_patch.py
          python3 ../c58_livekit_reconnect_patch.py
          python3 ../c59_legacy_presence_patch.py
          python3 ../c60_live_presence_patch.py
          python3 ../c61_stability_patch.py
          python3 ../c62_receive_presence_root_fix.py
          python3 ../c63_incoming_audio_patch.py
      - name: Build release APK
        script: |
          set -e
          cd melehat_build
          chmod +x gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
      - name: Sign and prepare APK artifact
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/artifacts"
          APK=$(find "$CM_BUILD_DIR/melehat_build/app/build/outputs/apk/release" -name "*.apk" | head -1)
          test -n "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          KEYSTORE="$CM_BUILD_DIR/melehat-c63-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass melehat63 \
            -keypass melehat63 \
            -alias melehat \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MELEHAT TELSIZ, OU=Android, O=MELEHAT, L=Samsun, ST=Samsun, C=TR"

          ALIGNED="$CM_BUILD_DIR/artifacts/MELEHAT-TELSIZ-C63-aligned.apk"
          FINAL="$CM_BUILD_DIR/artifacts/MELEHAT-TELSIZ-C63-CODEMAGIC.apk"
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias melehat \
            --ks-pass pass:melehat63 \
            --key-pass pass:melehat63 \
            --out "$FINAL" "$ALIGNED"
          "$APKSIGNER" verify --verbose "$FINAL"
          rm -f "$ALIGNED"
    artifacts:
      - artifacts/*.apk
