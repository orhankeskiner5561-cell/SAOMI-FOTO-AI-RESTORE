name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - name: Apply v0.26 clean auth refresh
        working-directory: melehat_build
        run: python3 ../v26_clean_auth_patch.py

      - name: Apply v0.27 updater
        working-directory: melehat_build
        run: python3 ../v27_updater_patch.py

      - name: Apply C37 PTT rebuild on clean v0.27
        working-directory: melehat_build
        run: python3 ../c37_v27_normal_install_patch.py

      - name: Android 15-16 install compatibility
        working-directory: melehat_build
        run: |
          cat >> gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: melehat_build
        run: gradle assembleRelease --stacktrace

      - name: Sign C37 release APK
        working-directory: melehat_build
        run: |
          KEYTOOL="$JAVA_HOME/bin/keytool"
          "$KEYTOOL" -genkeypair -v -keystore c37-release.jks -storepass melehat37 -keypass melehat37 -alias melehat -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Melehat Telsiz, OU=Android, O=Melehat, L=Samsun, C=TR"
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$UNSIGNED" app/build/outputs/apk/release/C37-aligned.apk
          "$APKSIGNER" sign --ks c37-release.jks --ks-pass pass:melehat37 --key-pass pass:melehat37 --out app/build/outputs/apk/release/C37-release.apk app/build/outputs/apk/release/C37-aligned.apk

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/release/C37-release.apk MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk
          "$ZIPALIGN" -c -v 4 MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk

      - name: Upload APK artifact before emulator
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL
          path: MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk
          if-no-files-found: error

      - name: Verify APK package and signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk | head -n 5
          "$APKSIGNER" verify --verbose MELEHAT-TELSIZ-C37-V27-NORMAL-INSTALL.apk


      - name: C37 verification complete
        run: echo "C37 APK signature, alignment and package checks passed."
