name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "melehat-update.json"
      - "MELEHAT_PRIVATE_VIDEO_CALL_PLAN.md"
      - "channel_rooms_stage1_spec.md"
      - "staging/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - name: Apply v0.26 clean auth refresh
        working-directory: melehat_build
        run: python3 ../v26_clean_auth_patch.py

      - name: Apply v0.27 updater
        working-directory: melehat_build
        run: python3 ../v27_updater_patch.py



      - name: Apply permanent release identity
        working-directory: melehat_build
        run: python3 ../permanent_release_patch.py

      - name: Apply persistent LiveKit channel core
        working-directory: melehat_build
        run: python3 ../live_channel_core.py

      - name: Apply real LiveKit presence and member UI
        working-directory: melehat_build
        run: python3 ../real_live_system_v120.py


      - name: Apply in-app updater UI
        working-directory: melehat_build
        run: python3 ../in_app_update_v122.py

      - name: Add member video call entry UI
        working-directory: melehat_build
        run: python3 ../video_call_stage1_v1320.py

      - name: Improve member list initial loading
        working-directory: melehat_build
        run: python3 ../member_startup_v1324.py

      - name: Add channel rooms visual preview
        working-directory: melehat_build
        run: python3 ../channel_rooms_preview_v1326.py

      - name: Wire authenticated room directory and join approval UI
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_room_ui_v1327.py

      - name: Refresh expired member directory and room sessions
        working-directory: melehat_build
        run: python3 ../staging/rooms/member_directory_refresh_v1328.py

      - name: Put channel buttons near the top without modifying PTT
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_room_two_buttons_v1328.py

      - name: Compact MELEHAT home screen to approved visual layout
        working-directory: melehat_build
        run: python3 ../staging/rooms/compact_main_ui_v1329.py

      - name: Generate common LiveKit room connector
        working-directory: melehat_build
        run: python3 ../staging/rooms/common_livekit_v1330.py

      - name: Generate serialized PTT room switching
        working-directory: melehat_build
        run: python3 ../staging/rooms/ptt_safe_room_switch_v1330.py

      - name: Connect authorized rooms to service
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_entry_ui_v1330.py

      - name: Owner channel deletion and real room membership
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_owner_members_v1331.py

      - name: Start signed-in users in common channel
        working-directory: melehat_build
        run: python3 ../staging/rooms/common_landing_after_login_v1332.py

      - name: Publish accurate LiveKit room presence
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_presence_live_v1333.py

      - name: Auto-enter new room and enable private video signaling UI
        working-directory: melehat_build
        run: python3 ../staging/video/video_call_ui_v1334.py

      - name: Add private video Android screen and camera
        working-directory: melehat_build
        run: python3 ../staging/video/integrate_video_v1334.py

      - name: Set release version in same build
        working-directory: melehat_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          t = p.read_text()
          t = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 164', t, count=1)
          t = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.3.34"', t, count=1)
          p.write_text(t)
          PY

      - name: Add Android installer wiring
        working-directory: melehat_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',1)
          if "androidx.core.content.FileProvider" not in s:
              block='''\n        <provider android:name="androidx.core.content.FileProvider" android:authorities="com.melehat.telsiz.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>\n'''
              s=s.replace("</application>",block+"    </application>",1)
          p.write_text(s)
          x=Path("app/src/main/res/xml"); x.mkdir(parents=True,exist_ok=True)
          (x/"file_paths.xml").write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><external-files-path name="updates" path="updates/" /></paths>')
          PY

      - name: Verify locked core and direct updater
        working-directory: melehat_build
        run: |
          set -e
          ROOT=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          MAN=app/src/main/AndroidManifest.xml
          PATHS=app/src/main/res/xml/file_paths.xml
          grep -F 'showMembers = true' "$ROOT"
          grep -F 'selectedMemberCount' "$ROOT"
          grep -F 'MELEHAT_UPDATE_MANIFEST' "$ROOT"
          grep -F 'DownloadManager' "$ROOT"
          grep -F 'FileProvider.getUriForFile' "$ROOT"
          grep -F 'application/vnd.android.package-archive' "$ROOT"
          grep -F 'REQUEST_INSTALL_PACKAGES' "$MAN"
          grep -F 'androidx.core.content.FileProvider' "$MAN"
          test -s "$PATHS"
          grep -F 'external-files-path' "$PATHS"
          grep -F 'applicationId = "com.melehat.telsiz"' app/build.gradle.kts
          grep -R -F 'class LiveKitPttClient' app/src/main/java
          grep -R -F 'class MelehatRoomApi' app/src/main/java
          grep -F 'KATILMA İSTEĞİ GÖNDER' "$ROOT"
          grep -F 'KANALI OLUŞTUR' "$ROOT"
          grep -F 'KABUL ET' "$ROOT"
          grep -F 'sessionRefresher.refresh()' app/src/main/java/com/saomi/telsiz/rooms/MelehatRoomApi.kt
          grep -F 'Üye listesi oturumu yenilenemedi.' app/src/main/java/com/saomi/telsiz/data/BackendApi.kt
          grep -F 'KANALLAR' "$ROOT"
          grep -F 'KANAL AÇ  +' "$ROOT"
          grep -F 'val roomsContext = androidx.compose.ui.platform.LocalContext.current' "$ROOT"
          grep -F 'MelehatRoomApi(roomsContext)' "$ROOT"
          grep -F 'var result = fetch(session)' app/src/main/java/com/saomi/telsiz/data/BackendApi.kt
          grep -F 'MELE - HAT ' "$ROOT"
          grep -F 'Color(0xFFE47732)' "$ROOT"
          grep -F 'showLegacyChannelPicker' "$ROOT"
          if grep -F 'Text(profile.phone, style = MaterialTheme.typography.bodySmall)' "$ROOT"; then
            echo "Profile header still visible: failing visual validation"
            exit 1
          fi
          grep -F 'roomSwitching || !ptt.isConnectedTo(channel.id)' app/src/main/java/com/saomi/telsiz/service/PttForegroundService.kt
          grep -F 'connectedChannelId == roomId' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'melehat-room-token' app/src/main/java/com/saomi/telsiz/voice/RoomTokenClient.kt
          grep -F 'migrateDefaultRoomToCommonOnce()' app/src/main/java/com/saomi/telsiz/MainActivity.kt
          grep -F 'ORTAK KANALA GİR' "$ROOT"
          grep -F 'commonLandingHandledUser' "$ROOT"
          grep -F 'roomSelection = createdId to cmd.second' "$ROOT"
          grep -F 'incomingVideoCall' "$ROOT"
          grep -F 'GÖRÜNTÜLÜ ARA' "$ROOT"
          grep -F 'AÇ / KABUL ET' "$ROOT"
          grep -F 'REDDET / KAPAT' "$ROOT"
          grep -F 'melehat_video_start' app/src/main/java/com/saomi/telsiz/video/VideoCallApi.kt
          grep -F 'video-' ../staging/video/VideoCallActivity.kt || true
          grep -F 'val track = event.track' app/src/main/java/com/saomi/telsiz/video/VideoCallActivity.kt
          grep -F 'VideoCallActivity' app/src/main/AndroidManifest.xml
          grep -F 'android.permission.CAMERA' app/src/main/AndroidManifest.xml

          grep -F 'activeRoomByUser[member.userId] == selectedRoomId' "$ROOT"
          grep -F 'Şu anda aktif:' "$ROOT"
          grep -F 'beginPresenceFor(channel.id)' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'melehat_report_room_presence' app/src/main/java/com/saomi/telsiz/voice/RoomPresenceReporter.kt
          grep -F 'melehat_active_room_users' app/src/main/java/com/saomi/telsiz/rooms/MelehatRoomApi.kt
          grep -F 'roomSelection = lobby.id to lobby.name' "$ROOT"
          grep -F 'LaunchedEffect(session?.userId, profile.isComplete)' "$ROOT"
          grep -F 'KANALI SİL' "$ROOT"
          grep -F '4 ÜYEYİ AKTAR' "$ROOT"
          grep -F 'visibleMemberIds' "$ROOT"
          grep -F 'melehat_delete_channel' app/src/main/java/com/saomi/telsiz/rooms/MelehatRoomApi.kt
          grep -F 'melehat_import_legacy_members' app/src/main/java/com/saomi/telsiz/rooms/MelehatRoomApi.kt
          grep -F 'LiveChannelUiState.roomId(channel.id)' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'KANALA GİR' "$ROOT"
          grep -F 'liveRoomName' "$ROOT"
          count="$(grep -c '^import com.saomi.telsiz.voice.LiveChannelUiState$' app/src/main/java/com/saomi/telsiz/service/PttForegroundService.kt)"
          test "$count" -eq 1
          count="$(grep -c '^import com.saomi.telsiz.model.ChannelInfo$' app/src/main/java/com/saomi/telsiz/service/PttForegroundService.kt)"
          test "$count" -eq 1
          if grep -F 'scope.launch { backend.joinChannel(session!!, c) }' "$ROOT"; then
            echo "Legacy direct channel join found; refusing release"
            exit 1
          fi
          echo MELEHAT_ROOM_API_AND_UI_OK
          echo LOCKED_CORE_AND_UPDATER_OK

      - name: Export generated AppRoot for direct UI source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GENERATED-APPROOT
          path: melehat_build/app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: V28 source snapshot
        run: |
          cd melehat_build
          zip -qr ../c56-source.zip app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml app/build.gradle.kts

      - name: Upload V28 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: V28-SOURCE-SNAPSHOT
          path: c56-source.zip

      - name: V28 audio map source snapshot
        run: |
          cd melehat_build
          grep -R -n "class LiveKitPttClient\|AudioTrack\|RemoteTrack\|setTransmitting\|participant\|speaker" app/src/main/java > ../c56-audio-map.txt || true

      - name: Upload C56 audio map
        uses: actions/upload-artifact@v4
        with:
          name: V28-AUDIO-MAP
          path: c56-audio-map.txt

      - name: Build APK
        working-directory: melehat_build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee ../melehat-gradle-build.log

      - name: Upload compilation log on failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-GRADLE-ERRORS
          path: melehat-gradle-build.log
          if-no-files-found: ignore

      - name: Sign permanent release APK
        working-directory: melehat_build
        env:
          MELEHAT_KEYSTORE_B64: ${{ secrets.MELEHAT_KEYSTORE_B64 }}
          MELEHAT_STORE_PASSWORD: ${{ secrets.MELEHAT_STORE_PASSWORD }}
          MELEHAT_KEY_PASSWORD: ${{ secrets.MELEHAT_KEY_PASSWORD }}
        run: |
          test -n "$MELEHAT_KEYSTORE_B64" || { echo "Missing MELEHAT_KEYSTORE_B64"; exit 2; }
          test -n "$MELEHAT_STORE_PASSWORD" || { echo "Missing MELEHAT_STORE_PASSWORD"; exit 2; }
          test -n "$MELEHAT_KEY_PASSWORD" || { echo "Missing MELEHAT_KEY_PASSWORD"; exit 2; }
          printf '%s' "$MELEHAT_KEYSTORE_B64" | base64 --decode > melehat-release.jks
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$UNSIGNED" app/build/outputs/apk/release/MELEHAT-aligned.apk
          "$APKSIGNER" sign --ks melehat-release.jks --ks-pass env:MELEHAT_STORE_PASSWORD --key-pass env:MELEHAT_KEY_PASSWORD --out app/build/outputs/apk/release/MELEHAT-release.apk app/build/outputs/apk/release/MELEHAT-aligned.apk

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/release/MELEHAT-release.apk MELEHAT-TELSIZ.apk

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs MELEHAT-TELSIZ.apk
          "$ZIPALIGN" -c -v 4 MELEHAT-TELSIZ.apk

      - name: Upload APK artifact before emulator
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ
          path: MELEHAT-TELSIZ.apk
          if-no-files-found: error

      - name: Publish in-app update APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.34 >/dev/null 2>&1 && { echo "Release v1.3.34 already exists; refusing to replace a distributed APK"; exit 1; } || true
          gh release create v1.3.34 MELEHAT-TELSIZ.apk --title "MELEHAT TELSIZ v1.3.34" --notes "MELEHAT TELSIZ 1.3.34 room routing"


      - name: Verify APK package and signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging MELEHAT-TELSIZ.apk | head -n 5
          "$APKSIGNER" verify --verbose MELEHAT-TELSIZ.apk


      - name: V28 verification complete
        run: echo "C56 checks passed."
