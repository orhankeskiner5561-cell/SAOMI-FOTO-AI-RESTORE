name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: melehat_build
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/debug/app-debug.apk MELEHAT-TELSIZ-v0.16-PTT-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ-v0.16-PTT-FIX
          path: MELEHAT-TELSIZ-v0.16-PTT-FIX.apk
