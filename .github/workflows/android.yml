name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "melehat-update.json"
      - "MELEHAT_PRIVATE_VIDEO_CALL_PLAN.md"
      - "channel_rooms_stage1_spec.md"
      - "staging/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - name: Apply v0.26 clean auth refresh
        working-directory: melehat_build
        run: python3 ../v26_clean_auth_patch.py

      - name: Apply v0.27 updater
        working-directory: melehat_build
        run: python3 ../v27_updater_patch.py



      - name: Apply permanent release identity
        working-directory: melehat_build
        run: python3 ../permanent_release_patch.py

      - name: Apply persistent LiveKit channel core
        working-directory: melehat_build
        run: python3 ../live_channel_core.py

      - name: Apply real LiveKit presence and member UI
        working-directory: melehat_build
        run: python3 ../real_live_system_v120.py


      - name: Apply in-app updater UI
        working-directory: melehat_build
        run: python3 ../in_app_update_v122.py

      - name: Add member video call entry UI
        working-directory: melehat_build
        run: python3 ../video_call_stage1_v1320.py

      - name: Improve member list initial loading
        working-directory: melehat_build
        run: python3 ../member_startup_v1324.py

      - name: Add channel rooms visual preview
        working-directory: melehat_build
        run: python3 ../channel_rooms_preview_v1326.py

      - name: Wire authenticated room directory and join approval UI
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_room_ui_v1327.py

      - name: Refresh expired member directory and room sessions
        working-directory: melehat_build
        run: python3 ../staging/rooms/member_directory_refresh_v1328.py

      - name: Put channel buttons near the top without modifying PTT
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_room_two_buttons_v1328.py

      - name: Compact MELEHAT home screen to approved visual layout
        working-directory: melehat_build
        run: python3 ../staging/rooms/compact_main_ui_v1329.py

      - name: Generate common LiveKit room connector
        working-directory: melehat_build
        run: python3 ../staging/rooms/common_livekit_v1330.py

      - name: Generate serialized PTT room switching
        working-directory: melehat_build
        run: python3 ../staging/rooms/ptt_safe_room_switch_v1330.py

      - name: Connect authorized rooms to service
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_entry_ui_v1330.py

      - name: Owner channel deletion and real room membership
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_owner_members_v1331.py

      - name: Start signed-in users in common channel
        working-directory: melehat_build
        run: python3 ../staging/rooms/common_landing_after_login_v1332.py

      - name: Publish accurate LiveKit room presence
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_presence_live_v1333.py

      - name: Auto-enter new room and enable private video signaling UI
        working-directory: melehat_build
        run: python3 ../staging/video/video_call_ui_v1334.py

      - name: Add private video Android screen and camera
        working-directory: melehat_build
        run: python3 ../staging/video/integrate_video_v1334.py

      - name: Real channel scrollbar and pending request badges
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_badges_scroll_v1336.py

      - name: Bidirectional room decision alerts and automatic channel refreshing
        working-directory: melehat_build
        run: python3 ../staging/rooms/room_decision_notifications_v1337.py

      - name: Incoming caller lockscreen and missed-call notices
        working-directory: melehat_build
        run: python3 ../staging/video/integrate_call_notifications_v1338.py

      - name: Repair ringtone and responsive MELEHAT channel header
        working-directory: melehat_build
        run: python3 ../staging/video/fix_ring_and_brand_v1339.py

      - name: Align radio status and toggle below channel buttons
        working-directory: melehat_build
        run: python3 ../staging/rooms/remove_redundant_main_join_v1340.py

      - name: Lower only the GUNCEL and UYELER cards
        working-directory: melehat_build
        run: python3 ../staging/rooms/lower_update_members_cards_v1341.py

      - name: Move GUNCEL and UYELER cards about 2cm lower
        working-directory: melehat_build
        run: python3 ../staging/rooms/lower_cards_2cm_v1342.py

      - name: Center PTT vertically between controls
        working-directory: melehat_build
        run: python3 ../staging/rooms/center_ptt_between_cards_v1343.py

      - name: Keep YouTube and Bluetooth media independent from idle radio
        working-directory: melehat_build
        run: python3 ../staging/audio/media_coexistence_v1344.py

      - name: Recover MELEHAT after Android background process eviction
        working-directory: melehat_build
        run: python3 ../staging/background/sticky_recovery_v1345.py

      - name: Configure brand-aware Android compatibility guidance
        working-directory: melehat_build
        run: python3 ../staging/compat/integrate_device_compatibility_v1346.py

      - name: Restore each member last chosen radio channel
        working-directory: melehat_build
        run: python3 ../staging/rooms/restore_last_member_room_v1348.py

      - name: Render genuine incoming voice waves on coffee PTT
        working-directory: melehat_build
        run: python3 ../staging/ptt/real_remote_audio_waves_v1349.py

      - name: Apply approved MELE-HAT yellow launcher icon
        working-directory: melehat_build
        run: python3 ../staging/launcher/apply_yellow_launcher_v1350.py

      - name: Add optional external Volume+ mandal with release watchdog
        working-directory: melehat_build
        run: python3 ../staging/ptt/external_volume_ptt_v1351.py

      - name: Diagnose locked-screen external PTT and route to already-running service
        working-directory: melehat_build
        run: python3 ../staging/ptt/external_screenoff_diagnostics_v1352.py

      - name: Restore visible external PTT onboarding and diagnostics
        working-directory: melehat_build
        run: python3 ../staging/ptt/external_ptt_guidance_v1353.py

      - name: Improve physical Volume+ long hold and persist key diagnostics
        working-directory: melehat_build
        run: python3 ../staging/ptt/external_key_safety_v1354.py

      - name: Prevent un-releasable dark-screen Volume+ PTT
        working-directory: melehat_build
        run: python3 ../staging/ptt/screenoff_failclosed_v1355.py

      - name: Unify hardware Volume+ ownership and release Activity hold
        working-directory: melehat_build
        run: python3 ../staging/ptt/single_owner_hardware_volume_v1356.py

      - name: Enable optional Shizuku raw key diagnostic (no audio transmission)
        working-directory: melehat_build
        run: python3 ../staging/ptt/shizuku_raw_test_v1357.py

      - name: Connect verified Shizuku raw KEY_DOWN and KEY_UP to safe PTT
        working-directory: melehat_build
        run: python3 ../staging/ptt/shizuku_ptt_bridge_v1358.py

      - name: Android-only physical Volume+ diagnostic (no Shizuku, no microphone)
        working-directory: melehat_build
        run: python3 ../staging/ptt/android_native_test_v1359.py

      - name: Restore independent Android key visibility before Shizuku ownership gate
        working-directory: melehat_build
        run: python3 ../staging/ptt/restore_native_visibility_v1360.py

      - name: Diagnose private-room LiveKit connection failures without touching microphone
        working-directory: melehat_build
        run: python3 ../staging/rooms/livekit_connection_diagnostics_v1361.py

      - name: Repair repeated LiveKit reconnects and compact error layout
        working-directory: melehat_build
        run: python3 ../staging/rooms/livekit_reconnect_stability_v1362.py

      - name: Add isolated in-app P2P 2.0 voice screen without replacing LiveKit
        working-directory: melehat_build
        run: python3 ../staging/p2p/android_p2p_entry_v1363.py

      - name: Replace web-based P2P pilot with native authenticated channel transport
        working-directory: melehat_build
        run: python3 ../staging/p2p/native_channel_integration_v1364.py

      - name: Display real P2P room members, speaking users and active counts
        working-directory: melehat_build
        run: python3 ../staging/p2p/room_activity_v1365.py

      - name: Integrate opt-in four-member P2P mesh while preserving duo audio
        working-directory: melehat_build
        run: python3 ../staging/p2p/group_mesh_v1366.py

      - name: Consolidate MELEHAT updater and display truthful radio connection
        working-directory: melehat_build
        run: python3 ../staging/updater/single_update_v1367.py

      - name: Use single MELEHAT radio UI and online presence even without listeners
        working-directory: melehat_build
        run: python3 ../staging/rooms/online_independent_of_peer_v1368.py

      - name: Enable authenticated P2P video and retain online status during calls
        working-directory: melehat_build
        run: python3 ../staging/video/native_video_integration_v1369.py

      - name: Stabilize MELEHAT room status text without moving controls
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_status_layout_v1370.py

      - name: Bind remote P2P camera frames and end calls on both phones
        working-directory: melehat_build
        run: python3 ../staging/video/p2p_video_receive_and_end_v1371.py

      - name: Register Android video encoders and reject audio-only SDP
        working-directory: melehat_build
        run: python3 ../staging/video/video_codec_negotiation_v1372.py

      - name: Keep accepted P2P video calls visible while securely dismissing keyguard
        working-directory: melehat_build
        run: python3 ../staging/video/accepted_call_keyguard_handoff_v1373.py

      - name: Keep accepted call in foreground and radio online when task is swiped
        working-directory: melehat_build
        run: python3 ../staging/video/keyguard_recents_radio_v1374.py

      - name: Keep enabled MELEHAT radio online across Wi-Fi/mobile handoffs
        working-directory: melehat_build
        run: python3 ../staging/background/radio_network_recovery_v1375.py

      - name: Remove legacy four-member import button from channel list only
        working-directory: melehat_build
        run: python3 ../staging/rooms/remove_legacy_import_button_v1376.py

      - name: Add fixed-position recent subscribers and unread indicator
        working-directory: melehat_build
        run: python3 ../staging/rooms/recent_subscribers_v1377.py

      - name: Verify new subscriber UI without touching PTT
        working-directory: melehat_build
        run: |
          grep -F 'MELEHAT_1377' ../staging/rooms/recent_subscribers_v1377.py
          grep -F 'YENİ ABONELER' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -Fx 'import com.saomi.telsiz.data.RecentSubscriber' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'melehat_recent_subscribers' app/src/main/java/com/saomi/telsiz/data/RecentSubscriberApi.kt
          grep -F 'onPtt(true)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'onPtt(false)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt

      - name: Raise GUNCEL and UYELER together while keeping PTT position
        working-directory: melehat_build
        run: python3 ../staging/rooms/lift_bottom_cards_v1378.py

      - name: Verify 30dp lift and protected PTT geometry
        working-directory: melehat_build
        run: |
          set -e
          ROOT=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'Row(Modifier.fillMaxWidth().offset(y = (-30).dp), horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.Top)' "$ROOT"
          grep -F 'Box(Modifier.size(210.dp).offset(y = 60.dp), contentAlignment = Alignment.Center)' "$ROOT"
          grep -F 'Spacer(Modifier.height(120.dp))' "$ROOT"
          grep -F 'showMembers = true' "$ROOT"
          grep -F 'MELEHAT_UPDATE_MANIFEST' "$ROOT"
          grep -F 'YENİ ABONELER' "$ROOT"
          grep -F 'onPtt(true)' "$ROOT"
          grep -F 'onPtt(false)' "$ROOT"

      - name: Repair clipped updater and real bottom-card clearance
        working-directory: melehat_build
        run: python3 ../staging/updater/restore_visible_update_card_v1379.py

      - name: Verify updater button visibility and protected radio controls
        working-directory: melehat_build
        run: |
          set -e
          ROOT=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'Spacer(Modifier.height(90.dp))' "$ROOT"
          grep -F 'Modifier.fillMaxWidth().heightIn(min = 86.dp)' "$ROOT"
          grep -F 'Text("GÜNCELLE", fontSize = 12.sp, maxLines = 1)' "$ROOT"
          grep -F 'YENİ SÜRÜM: v' "$ROOT"
          grep -F '🟢 GÜNCEL' "$ROOT"
          grep -F 'verticalScroll(rememberScrollState())' "$ROOT"
          grep -F 'Box(Modifier.size(210.dp).offset(y = 60.dp), contentAlignment = Alignment.Center)' "$ROOT"
          grep -F 'onPtt(true)' "$ROOT"
          grep -F 'onPtt(false)' "$ROOT"
          grep -F 'KURULUMU TAMAMLA' "$ROOT"
          grep -F 'YENİ ABONELER' "$ROOT"
          if grep -F 'Row(Modifier.fillMaxWidth().offset(y = (-30).dp)' "$ROOT"; then
            echo 'Bad offset of lower cards remains'
            exit 1
          fi

      - name: Apply actual remote-speech triple brown rings and red transmit PTT
        working-directory: melehat_build
        run: python3 ../staging/ptt/remote_brown_rings_red_ptt_v1380.py

      - name: Verify remote audio rings and preserve microphone behavior
        working-directory: melehat_build
        run: |
          set -e
          ROOT=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'Color(0xFF654333)' "$ROOT"
          grep -F 'for (ring in 0..2)' "$ROOT"
          grep -F 'Modifier.requiredSize(250.dp)' "$ROOT"
          grep -F 'transmitting -> Color(0xFFD32F2F)' "$ROOT"
          grep -F 'else -> Color(0xFFA6806E)' "$ROOT"
          grep -F 'onPtt(true)' "$ROOT"
          grep -F 'onPtt(false)' "$ROOT"
          grep -F 'showMembers = true' "$ROOT"
          grep -F 'YENİ ABONELER' "$ROOT"
          grep -F 'GÜNCELLE' "$ROOT"
          grep -F 'MELEHAT_UPDATE_MANIFEST' "$ROOT"
          grep -F 'class RemoteVoiceStatsMeter' app/src/main/java/com/saomi/telsiz/p2p/RemoteVoiceStatsMeter.kt
          grep -F 'getStats {' app/src/main/java/com/saomi/telsiz/p2p/RemoteVoiceStatsMeter.kt
          grep -F 'startRemoteVoiceMeter' app/src/main/java/com/saomi/telsiz/p2p/P2pRadioClient.kt
          grep -F 'startRemoteVoiceMeter' app/src/main/java/com/saomi/telsiz/p2p/P2pMeshRadioClient.kt
          grep -F 'setEnabled(false)' app/src/main/java/com/saomi/telsiz/p2p/P2pRadioClient.kt
          grep -F 'setEnabled(false)' app/src/main/java/com/saomi/telsiz/p2p/P2pMeshRadioClient.kt
          grep -F 'applicationId = "com.melehat.telsiz"' app/build.gradle.kts

      - name: Move ÇIKIŞ left of Kanallar KAPAT and hide seen join decisions
        working-directory: melehat_build
        run: python3 ../staging/rooms/channel_footer_and_seen_result_v1381.py

      - name: Verify one-time decision notice and moved logout
        working-directory: melehat_build
        run: |
          set -e
          ROOT=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'Text("ÇIKIŞ")' "$ROOT"
          grep -F 'horizontalArrangement = Arrangement.SpaceBetween' "$ROOT"
          grep -F 'myLatestJoinRequest?.resultSeenAt == null' "$ROOT"
          grep -F 'markDecisionNoticesSeen(me, unseenIds)' "$ROOT"
          grep -F 'Text("KAPAT")' "$ROOT"
          grep -F 'Color(0xFF654333)' "$ROOT"
          grep -F 'Color(0xFFD32F2F)' "$ROOT"
          grep -F 'YENİ ABONELER' "$ROOT"
          grep -F 'GÜNCELLE' "$ROOT"
          grep -F 'onPtt(true)' "$ROOT"
          grep -F 'onPtt(false)' "$ROOT"
          grep -F 'P2pVideoCallActivity' "$ROOT"
          if grep -F 'Text("Çıkış")' "$ROOT"; then
            echo "Old home-screen logout remains"
            exit 1
          fi

      - name: Enable consent-gated safe screen-off hardware key test
        working-directory: melehat_build
        run: python3 ../staging/ptt/screen_off_verified_native_v1382.py

      - name: Verify Android lockscreen safety, consent and old radio core
        working-directory: melehat_build
        run: |
          set -e
          S=app/src/main/java/com/saomi/telsiz/service
          C=app/src/main/java/com/saomi/telsiz/compat/DeviceCompatibilityActivity.kt
          grep -F 'class VolumePttAccessibilityService' "$S/VolumePttAccessibilityService.kt"
          grep -F 'ScreenOffPttEligibility.allowed(this)' "$S/VolumePttAccessibilityService.kt"
          grep -F 'ScreenOffPttEligibility.allowed(this)' "$S/PttForegroundService.kt"
          grep -F 'ScreenOffPttEligibility.recordPair' "$S/NativeVolumeProbe.kt"
          grep -F 'NO_REPEAT_LIMIT_MS = 8000L' "$S/VolumePttAccessibilityService.kt"
          grep -F 'REPEAT_SILENCE_MS = 3500L' "$S/VolumePttAccessibilityService.kt"
          grep -F 'SCREEN_OFF_FORCED_RELEASE' "$S/VolumePttAccessibilityService.kt"
          grep -F 'SCREEN_OFF_SERVICE_FORCED_RELEASE' "$S/PttForegroundService.kt"
          grep -F 'ScreenOffPttEligibility.consent' "$C"
          grep -F 'KABUL EDİYORUM' "$C"
          grep -F 'onPtt(true)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'onPtt(false)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'applicationId = "com.melehat.telsiz"' app/build.gradle.kts

      - name: Rebuild responsive home with measured header and adaptive PTT
        working-directory: melehat_build
        run: python3 ../staging/rooms/responsive_home_v1383.py

      - name: Validate responsive home and preserve channels and hardware PTT
        working-directory: melehat_build
        run: |
          set -e
          R=app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'MELE - HAT ' "$R"
          grep -F 'val titleSp =' "$R"
          grep -F 'val pttDiameter =' "$R"
          grep -F 'ringDiameter = pttDiameter + 48.dp' "$R"
          grep -F 'heightIn(min = 90.dp)' "$R"
          grep -F 'for (ring in 0..2)' "$R"
          grep -F 'transmitting -> Color(0xFFD32F2F)' "$R"
          grep -F 'heightIn(min = 68.dp)' "$R"
          grep -F 'heightIn(min = 58.dp)' "$R"
          grep -F 'Text("GÜNCELLE", fontSize = 12.sp, maxLines = 1)' "$R"
          grep -F 'onPtt(true)' "$R"
          grep -F 'onPtt(false)' "$R"
          grep -F 'markDecisionNoticesSeen(me, unseenIds)' "$R"
          grep -F 'RecentSubscriberApi' "$R"
          grep -F 'showMembers = true' "$R"
          grep -F 'P2pVideoCallActivity' "$R"
          if grep -F '.offset(y = 54.dp)' "$R"; then
            echo "Subscriber button is still positioned by unsafe visual offset"
            exit 1
          fi

      - name: Add optional smart 2 second quiet external PTT
        working-directory: melehat_build
        run: python3 ../staging/ptt/smart_voice_release_v1384.py

      - name: Verify opt-in smart PTT with microphone fail-safes
        working-directory: melehat_build
        run: |
          set -e
          F=app/src/main/java/com/saomi/telsiz/service
          test -s "$F/SmartExternalVoiceGate.kt"
          grep -F 'QUIET_MS=2000L' "$F/SmartExternalVoiceGate.kt"
          grep -F 'NO_SAMPLES_MS=1700L' "$F/SmartExternalVoiceGate.kt"
          grep -F 'MAX_TALK_MS=15000L' "$F/SmartExternalVoiceGate.kt"
          grep -F 'fun allowed(ctx:Context)' "$F/SmartExternalVoiceGate.kt"
          grep -F 'onPcm(' app/src/main/java/com/saomi/telsiz/p2p/P2pRadioClient.kt
          grep -F 'onPcm(' app/src/main/java/com/saomi/telsiz/p2p/P2pMeshRadioClient.kt
          grep -F 'startSmartVoiceMonitor(requestId)' "$F/PttForegroundService.kt"
          grep -F 'SmartExternalPttMode.markClosed(this)' "$F/PttForegroundService.kt"
          grep -F 'SmartExternalPttMode.closedAfter(this,lastDownAt)' "$F/VolumePttAccessibilityService.kt"
          grep -F 'AKILLI MANDALI AÇ' app/src/main/java/com/saomi/telsiz/compat/DeviceCompatibilityActivity.kt
          grep -F 'onPtt(true)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'onPtt(false)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'P2pVideoCallActivity' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'applicationId = "com.melehat.telsiz"' app/build.gradle.kts

      - name: Restore v1.3.58 Shizuku raw mandal with automatic rearm
        working-directory: melehat_build
        run: python3 ../staging/ptt/restore_shizuku_v1385.py

      - name: Verify raw Shizuku UP release and user-owned resume
        working-directory: melehat_build
        run: |
          set -e
          S=app/src/main/java/com/saomi/telsiz/service
          UI=app/src/main/java/com/saomi/telsiz/compat/DeviceCompatibilityActivity.kt
          grep -F 'RAW_MAX_HOLD_MS = 30000L' "$S/PttForegroundService.kt"
          grep -F 'rawPttRelease("RAW_PTT_UP")' "$S/PttForegroundService.kt"
          grep -F 'rawPttRelease("RAW_SAFETY_RELEASE")' "$S/PttForegroundService.kt"
          grep -F 'if(rawDesired() && started && store.isRadioEnabled()' "$S/PttForegroundService.kt"
          grep -F 'RAW_MODE_ARMED_V1358_RESTORED' "$S/PttForegroundService.kt"
          grep -F 'startRawRestore()' "$S/PttForegroundService.kt"
          grep -F 'stopRawRestore()' "$S/PttForegroundService.kt"
          grep -F 'SmartExternalPttMode.setEnabled(this,false)' "$S/PttForegroundService.kt"
          grep -F 'if (ShizukuRawPttState.enabled)' "$S/VolumePttAccessibilityService.kt"
          grep -F 'onRawKey(event)' "$S/ShizukuRawKeyProbe.kt"
          grep -F 'Shizuku yeniden bağlanma tercihi' "$UI"
          grep -F 'SHIZUKU DIŞ MANDALI AÇ' "$UI"
          grep -F 'SHIZUKU DIŞ MANDALI KAPAT' "$UI"
          grep -F 'onPtt(true)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'onPtt(false)' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
