name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - name: Apply v0.26 clean auth refresh
        working-directory: melehat_build
        run: python3 ../v26_clean_auth_patch.py

      - name: Apply v0.27 updater
        working-directory: melehat_build
        run: python3 ../v27_updater_patch.py

      - name: Apply C30 directly on clean v0.27
        working-directory: melehat_build
        run: python3 ../c30_v27_clean_ptt_patch.py

      - name: Make C33 unique install-test package
        working-directory: melehat_build
        run: |
          sed -i 's/applicationId = "com.melehat.telsiz.v27"/applicationId = "com.melehat.c33test"/' app/build.gradle.kts
          sed -i 's/versionCode = 30/versionCode = 33/' app/build.gradle.kts
          sed -i 's/versionName = "C30-v27-clean-base"/versionName = "C33-install-test"/' app/build.gradle.kts

      - name: Android 15-16 install compatibility
        working-directory: melehat_build
        run: |
          cat >> gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: melehat_build
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/debug/app-debug.apk MELEHAT-TELSIZ-C33-INSTALL-TEST.apk

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs MELEHAT-TELSIZ-C33-INSTALL-TEST.apk
          "$ZIPALIGN" -c -v 4 MELEHAT-TELSIZ-C33-INSTALL-TEST.apk

      - name: Upload APK artifact before emulator
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ-C33-INSTALL-TEST
          path: MELEHAT-TELSIZ-C33-INSTALL-TEST.apk
          if-no-files-found: error

      - name: Verify APK package and signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging MELEHAT-TELSIZ-C33-INSTALL-TEST.apk | head -n 5
          "$APKSIGNER" verify --verbose MELEHAT-TELSIZ-C33-INSTALL-TEST.apk
