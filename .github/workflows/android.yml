          grep -F 'ExternalPttDiagnostics.describe(this,"native")' app/src/main/java/com/saomi/telsiz/compat/DeviceCompatibilityActivity.kt
          grep -F 'ANDROID_ONLY_TEST_ALREADY_RUNNING_NO_RESET' app/src/main/java/com/saomi/telsiz/service/NativeVolumeProbe.kt
          grep -F '"native" -> stage' app/src/main/java/com/saomi/telsiz/service/ExternalPttDiagnostics.kt
          grep -F 'LIVEKIT_CONNECT_HATASI' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'LiveChannelUiState.connectionProblem.collectAsState()' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          grep -F 'TOKEN_ALINDI_CANLI_BAGLANTI_BEKLENIYOR' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'ShizukuRawPttState.enabled' app/src/main/java/com/saomi/telsiz/service/PttForegroundService.kt
          grep -F 'SUNUCU_429_ISTEK_SINIRI' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'reconnectDelayMs()' app/src/main/java/com/saomi/telsiz/service/PttForegroundService.kt
          grep -F 'r.release()' app/src/main/java/com/saomi/telsiz/voice/LiveKitPttClient.kt
          grep -F 'val radioOnline = radioOn &&' app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt
          echo MELEHAT_1362_RETRY_RELEASE_LAYOUT_OK
          echo MELEHAT_1361_LIVEKIT_DIAGNOSTIC_ONLY_OK
          echo MELEHAT_1360_RESTORED_ANDROID_NATIVE_LOGS_OK
          echo MELEHAT_1359_NATIVE_ONLY_TEST_OK
          echo MELEHAT_1358_RAW_PTT_SAFETY_OK
          echo MELEHAT_1357_SHIZUKU_DIAG_ONLY_OK
          echo MELEHAT_1356_SINGLE_VOLUME_OWNER_OK
          echo MELEHAT_1355_SAFE_SCREENOFF_BLOCK_OK
          echo MELEHAT_EXTERNAL_PTT_REPEATS_AND_FAILSAFE_OK
          echo MELEHAT_EXTERNAL_PTT_SETTINGS_READY
          echo MELEHAT_EXTERNAL_VOLUME_PTT_SOURCE_OK
          echo LOCKED_CORE_AND_UPDATER_OK

      - name: Export generated AppRoot for direct UI source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GENERATED-APPROOT
          path: melehat_build/app/src/main/java/com/saomi/telsiz/ui/AppRoot.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: V28 source snapshot
        run: |
          cd melehat_build
          zip -qr ../c56-source.zip app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml app/build.gradle.kts

      - name: Upload V28 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: V28-SOURCE-SNAPSHOT
          path: c56-source.zip

      - name: V28 audio map source snapshot
        run: |
          cd melehat_build
          grep -R -n "class LiveKitPttClient\|AudioTrack\|RemoteTrack\|setTransmitting\|participant\|speaker" app/src/main/java > ../c56-audio-map.txt || true

      - name: Upload C56 audio map
        uses: actions/upload-artifact@v4
        with:
          name: V28-AUDIO-MAP
          path: c56-audio-map.txt

      - name: Build APK
        working-directory: melehat_build
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee ../melehat-gradle-build.log

      - name: Upload compilation log on failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-GRADLE-ERRORS
          path: melehat-gradle-build.log
          if-no-files-found: ignore

      - name: Sign permanent release APK
        working-directory: melehat_build
        env:
          MELEHAT_KEYSTORE_B64: ${{ secrets.MELEHAT_KEYSTORE_B64 }}
          MELEHAT_STORE_PASSWORD: ${{ secrets.MELEHAT_STORE_PASSWORD }}
          MELEHAT_KEY_PASSWORD: ${{ secrets.MELEHAT_KEY_PASSWORD }}
        run: |
          test -n "$MELEHAT_KEYSTORE_B64" || { echo "Missing MELEHAT_KEYSTORE_B64"; exit 2; }
          test -n "$MELEHAT_STORE_PASSWORD" || { echo "Missing MELEHAT_STORE_PASSWORD"; exit 2; }
          test -n "$MELEHAT_KEY_PASSWORD" || { echo "Missing MELEHAT_KEY_PASSWORD"; exit 2; }
          printf '%s' "$MELEHAT_KEYSTORE_B64" | base64 --decode > melehat-release.jks
          UNSIGNED=$(find app/build/outputs/apk/release -name '*unsigned*.apk' | head -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$ZIPALIGN" -f 4 "$UNSIGNED" app/build/outputs/apk/release/MELEHAT-aligned.apk
          "$APKSIGNER" sign --ks melehat-release.jks --ks-pass env:MELEHAT_STORE_PASSWORD --key-pass env:MELEHAT_KEY_PASSWORD --out app/build/outputs/apk/release/MELEHAT-release.apk app/build/outputs/apk/release/MELEHAT-aligned.apk

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/release/MELEHAT-release.apk MELEHAT-TELSIZ.apk

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs MELEHAT-TELSIZ.apk
          "$ZIPALIGN" -c -v 4 MELEHAT-TELSIZ.apk

      - name: Upload APK artifact before emulator
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ
          path: MELEHAT-TELSIZ.apk
          if-no-files-found: error

      - name: Publish in-app update APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.3.85 >/dev/null 2>&1 && { echo "Release v1.3.85 already exists; refusing to replace a distributed APK"; exit 1; } || true
          gh release create v1.3.85 MELEHAT-TELSIZ.apk --title "MELEHAT TELSIZ v1.3.85" --notes "Restore verified v1.3.58 Shizuku raw Volume+ key PTT DOWN and UP, opt-in rearm after room switch/radio service recreation, single external key owner, fallback smart mode off during raw usage, 30s fail-closed cap. Keep all regular voice/video, subscriber, channel and app signing unchanged."


      - name: Verify APK package and signature
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging MELEHAT-TELSIZ.apk | head -n 5
          "$APKSIGNER" verify --verbose MELEHAT-TELSIZ.apk


      - name: V28 verification complete
        run: echo "C56 checks passed."
