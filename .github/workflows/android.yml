name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack base source
        run: |
          rm -rf melehat_build
          mkdir melehat_build
          unzip -oq melehat_v10.zip -d melehat_build

      - name: Apply Android 16 audio fix
        working-directory: melehat_build
        run: python3 ../v12_patch.py

      - name: Repair v0.14 patch line ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v14_patch.py')
          s=p.read_text()
          s=s.replace('\\ns = s.replace("MELEHAT TELSİZ v0.10"', '\ns = s.replace("MELEHAT TELSİZ v0.10"')
          p.write_text(s)
          PY

      - name: Apply v0.14 six-digit email OTP
        working-directory: melehat_build
        run: python3 ../v14_patch.py

      - name: Apply v0.14 compile fixes
        working-directory: melehat_build
        run: python3 ../v14_fix_patch.py

      - name: Apply v0.15 flexible OTP
        working-directory: melehat_build
        run: python3 ../v15_patch.py

      - name: Apply v0.16 strict hold-to-talk fix
        working-directory: melehat_build
        run: python3 ../v16_patch.py

      - name: Apply v0.26 clean auth refresh
        working-directory: melehat_build
        run: python3 ../v26_clean_auth_patch.py

      - name: Apply v0.27 updater
        working-directory: melehat_build
        run: python3 ../v27_updater_patch.py

      - name: Apply v0.28 external Volume+ PTT test\n        working-directory: melehat_build\n        run: python3 ../v28_external_ptt_patch.py\n\n      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: melehat_build
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/debug/app-debug.apk MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST.apk

      - name: Verify APK signature and alignment
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST.apk
          "$ZIPALIGN" -c -v 4 MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST.apk

      - name: Upload APK artifact before emulator
        uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST
          path: MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST.apk
          if-no-files-found: error

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb install -r MELEHAT-TELSIZ-v0.28-EXTERNAL-PTT-TEST.apk


