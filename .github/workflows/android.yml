name: MELEHAT TELSIZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild MELEHAT source
        run: |
          rm -rf melehat_build
          mkdir -p melehat_build
          base64 -d melehat_source.b64 > /tmp/melehat.zip
          unzip -t /tmp/melehat.zip
          unzip -oq /tmp/melehat.zip -d melehat_build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: melehat_build
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp melehat_build/app/build/outputs/apk/debug/app-debug.apk MELEHAT-TELSIZ-v0.8.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MELEHAT-TELSIZ-v0.8
          path: MELEHAT-TELSIZ-v0.8.apk
