name: MELEHAT Server Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    paths:
      - ".github/workflows/melehat-healthcheck.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Supabase LiveKit gateway
        shell: bash
        env:
          SUPABASE_URL: https://ecbzcexhpzntgrfpizxc.supabase.co
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, sys

          base = os.environ["SUPABASE_URL"].rstrip("/")
          checks = [
              ("LiveKit gateway", "/functions/v1/livekit-health", "livekit"),
          ]
          failed = []
          for label, path, kind in checks:
              error = "unavailable"
              for attempt in range(1, 4):
                  try:
                      request = urllib.request.Request(base + path, headers={"User-Agent": "MELEHAT-health-monitor/1.0"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          status = response.status
                          body = response.read(65536).decode("utf-8", "replace")
                      if status != 200:
                          raise RuntimeError(f"HTTP {status}")
                      data = json.loads(body)
                      if not isinstance(data, dict):
                          raise RuntimeError("Unexpected JSON response")
                      if kind == "livekit":
                          if data.get("configured") is not True:
                              raise RuntimeError("LiveKit not configured")
                          if data.get("host_reachable") is not True:
                              raise RuntimeError("LiveKit host not reachable")
                          if data.get("room_api_ok") is False:
                              raise RuntimeError("LiveKit room API unavailable")
                      print(f"PASS {label}: HTTP {status}")
                      error = None
                      break
                  except (urllib.error.URLError, ValueError, RuntimeError, TimeoutError) as exc:
                      error = str(exc)[:250]
                      print(f"Attempt {attempt}/3 for {label} failed: {error}")
                      if attempt < 3:
                          time.sleep(5)
              if error is not None:
                  failed.append(f"{label}: {error}")
          if failed:
              print("::error::MELEHAT service health check failed: " + "; ".join(failed))
              sys.exit(1)
          print("MELEHAT service health checks passed.")
          PY
