name: MELEHAT LiveKit Connection Health Check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/melehat-healthcheck.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check token gateway and LiveKit host reachability
        shell: bash
        env:
          HEALTH_URL: https://ecbzcexhpzntgrfpizxc.supabase.co/functions/v1/livekit-health
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt:"
            if result=$(curl -sS --max-time 14 "$HEALTH_URL"); then
              export HEALTH_JSON="$result"
              python3 - <<'PY'
          import json,os
          j=json.loads(os.environ['HEALTH_JSON'])
          print("LiveKit configured:", j.get("configured"))
          print("LiveKit host reachable:", j.get("host_reachable"))
          print("LiveKit server protocol:", j.get("server_protocol","unknown"))
          print("Standard port:", j.get("standard_port","unknown"))
          print("Room API:", j.get("room_api_ok","unknown"))
          print("Signaling websocket:", j.get("signaling_websocket","unknown"))
          print("Host HTTP response:", j.get("http_status","unavailable"))
          print("Failure category:", j.get("failure","none"))
          if j.get("room_api_ok") is not None: print("Room management API:", j.get("room_api_ok"))
          print("WebSocket probe:", j.get("signaling_websocket","n/a"))
          print("Token validation HTTP:", j.get("validate_http_status","n/a"))
          print("WebSocket endpoint as HTTP:", j.get("rtc_plain_http_status","n/a"))
          print("Latency (ms):", j.get("latency_ms","unknown"))
          PY
              exit 0
            fi
            sleep 3
          done
          exit 1
